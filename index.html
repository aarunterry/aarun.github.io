        const indicator = document.getElementById(`step-indicator-${i}`);
        indicator.querySelector('div').classList.remove('bg-primary', 'text-white');
        indicator.querySelector('div').classList.add('bg-gray-300', 'text-gray-600');
      }

      // 更新进度条
      if (step > 1) {
        document.getElementById(`progress-${step-1}-${step}`).style.width = '100%';
      }

      // 显示当前步骤并更新指示器
      if (step === 1) {
        step1.classList.remove('hidden');
      } else if (step === 2) {
        step2.classList.remove('hidden');

        step3.classList.remove('hidden');

        calculateResult();

      const currentIndicator = document.getElementById(`step-indicator-${step}`);
      currentIndicator.querySelector('div').classList.remove('bg-gray-300', 'text-gray-600');

    // 计算BMI
    function calculateBMI() {
      height = parseFloat(document.getElementById('height').value);
      weight = parseFloat(document.getElementById('weight').value);

      if (isNaN(height) || height <= 0 || height > 250) {
        alert('请输入有效的身高');
        return;
      }

      if (isNaN(weight) || weight <= 0 || weight > 300) {
        alert('请输入有效的体重');
        return;
      }

      // 计算BMI
      bmiValue = (weight / ((height / 100) ** 2)).toFixed(1);
      
      // 显示结果
      document.getElementById('bmi-value').textContent = bmiValue;
      
      let category = '';
      if (bmiValue < 18.5) {
        category = '偏瘦：您的体重低于健康范围，建议适当增加营养摄入。';
      } else if (bmiValue < 24) {
        category = '正常：您的体重在健康范围内，继续保持良好的生活习惯。';
      } else if (bmiValue < 28) {
        category = '超重：您的体重略高于健康范围，建议适当控制饮食并增加运动。';
      } else {
        category = '肥胖：您的体重明显高于健康范围，建议采取积极的体重管理措施。';
      }
      
      document.getElementById('bmi-category').textContent = category;
      document.getElementById('bmi-result').classList.remove('hidden');

      setTimeout(() => {
        goToStep(3);

        </div>
        
        <div class="mb-6">
          <h3 class="text-xl font-bold text-primary mb-3">运动建议</h3>
          <div class="p-4 bg-white rounded-lg shadow border border-gray-200">
            <p class="whitespace-pre-line">${plan.exercise}</p>
          </div>
        </div>
        
        <div class="mb-6">
          <h3 class="text-xl font-bold text-primary mb-3">穴位按摩建议</h3>
          <div class="p-4 bg-white rounded-lg shadow border border-gray-200">
            <p class="whitespace-pre-line">${plan.acupoint}</p>
          </div>
        </div>
      `;
      
      // 生成用于图片的结果HTML（简化版）
      const imageResultHtml = `
        <div class="text-center mb-4">
          <h2 class="text-xl font-bold text-primary">元宇说&鲡喵烘焙体重管理测评报告</h2>
          <p class="text-sm text-gray-600">${new Date().toLocaleDateString()}</p>
        </div>
        
        <div class="border-t border-gray-200 pt-3 mb-3">
          <h3 class="font-medium mb-2">个人信息</h3>
          <p><span class="text-gray-600">姓名：</span>${name}</p>
          <p><span class="text-gray-600">年龄：</span>${age}岁</p>
          <p><span class="text-gray-600">性别：</span>${gender === 'male' ? '男' : '女'}</p>
          <p><span class="text-gray-600">BMI指数：</span>${bmiValue}</p>
        </div>
        
        <div class="border-t border-gray-200 pt-3 mb-3">
          <h3 class="font-medium mb-2">测评结果</h3>
          <p>体质类型：<span class="font-bold text-primary">${plan.name}</span>（方案${resultType}号）</p>
          <p>健康体重目标：${healthyWeight} kg (BMI 24)</p>
          ${weightToLose > 0 ? `<p>建议减少体重：${weightToLose} kg</p>` : ''}
        </div>
        
        <div class="border-t border-gray-200 pt-3 mb-3">
          <h3 class="font-medium mb-2">饮食建议</h3>
          <p class="text-sm">${plan.diet.replace(/<br>/g, ' ')}</p>
        </div>
        
        <div class="border-t border-gray-200 pt-3 mb-3">
          <h3 class="font-medium mb-2">运动建议</h3>
          <p class="text-sm">${plan.exercise.replace(/<br>/g, ' ')}</p>
        </div>
      `;
      
      // 显示结果
      resultContainer.innerHTML = resultHtml;
      resultForImage.innerHTML = imageResultHtml;
      resultImageContainer.classList.remove('hidden');
    }

    // 下载结果图片
    function downloadResultImage() {
      html2canvas(document.getElementById('result-for-image')).then(canvas => {
        const link = document.createElement('a');
        link.download = '体重管理测评报告.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // 重新测评
    function restartTest() {
      // 重置变量
      currentStep = 1;
      currentQuestion = 0;
      answers = [];
      bmiValue = null;
      height = null;
      weight = null;
      
      // 重置表单
      document.getElementById('personal-info-form').reset();
      document.getElementById('bmi-form').reset();
      document.getElementById('bmi-result').classList.add('hidden');
      
      // 重置进度条
      document.getElementById('progress-1-2').style.width = '0';
      document.getElementById('progress-2-3').style.width = '0';
      document.getElementById('progress-3-4').style.width = '0';
      
      // 回到第一步
      goToStep(1);
    }

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      goToStep(1);
    });
  </script>
</body>
</html>
